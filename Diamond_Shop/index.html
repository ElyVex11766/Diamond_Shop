
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Diamond Shop | پرداخت سفارش</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080b12;
      color: #f4f8ff;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 32px 24px;
      text-align: center;
      background: #101722;
      border: 1px solid #183d59;
      border-radius: 20px;
      box-shadow: 0 0 45px #00aaff12;
    }
    .logo {
      color: #00aaff;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    h1 { font-size: 22px; margin-top: 28px; }
    p { color: #9eafc4; line-height: 2; font-size: 14px; }
    .status {
      display: inline-block;
      margin-top: 18px;
      padding: 9px 14px;
      border-radius: 10px;
      background: #09283b;
      color: #51d8ff;
      font-size: 13px;
    }
    footer { margin-top: 28px; color: #62748b; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">💎 DIAMOND SHOP</div>
    <h1>درگاه سفارش شما</h1>
    <p>
      اطلاعات سفارش و مبلغ پرداخت پس از اتصال به سیستم سفارش‌ها
      در این صفحه نمایش داده خواهد شد.
    </p>
    <div class="status">سیستم در حال راه‌اندازی است</div>
    <footer>Diamond Shop · Secure Order Portal</footer>
  </main>
</body>
</html>
